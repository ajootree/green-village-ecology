name: Check and deploy ecology game

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'qa/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check game and saving
        run: |
          node --check dist/app.mjs
          node --check dist/cloud.mjs
          node --check dist/story.mjs
          node --check dist/effects.mjs
          node --check dist/learning-ui.mjs
          node --check dist/bonus.mjs
          node --check dist/ending-memories.mjs
          node qa/check-learning.mjs
          node qa/check-model.mjs
          node qa/check-state.mjs
          node qa/check-world.mjs
          node qa/check-missions.mjs
          node qa/check-navigation.mjs
          node --experimental-vm-modules qa/check-save-schedule.mjs

  deploy:
    needs: check
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '3375959224884e815872d29033c3ded4'
          command: pages deploy dist --project-name=422-green-village --branch=main
