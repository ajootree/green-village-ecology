<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/world.css"><link rel="stylesheet" href="/missions.css"><link rel="stylesheet" href="/experience.css"><style>body{padding:12px;background:#31513f;color:#fff3cc}.qa-controls{height:45px;display:flex;align-items:center;gap:15px}select{font:inherit}#work{height:calc(100dvh - 80px);max-width:900px;margin:auto}</style><div class="qa-controls"><label>작업 선택 <select id="mission-select"></select></label><strong id="qa-status"></strong><button id="qa-reset">다시 하기</button></div><div id="work"></div><script type="module">import{createMission,mountMission,missionInfo}from'/missions.mjs';import{seasons}from'/model.mjs';const select=document.querySelector('select');select.innerHTML=seasons.flatMap((s,i)=>s.choices.map(c=>`<option value="${i}:${c.id}">${s.name} · ${missionInfo(i,c.id).title}</option>`)).join('');let stop=()=>{};function draw(){stop();const[i,id]=select.value.split(':');stop=mountMission(document.querySelector('#work'),createMission(Number(i),id),done=>document.querySelector('#qa-status').textContent=done?'완료':'진행 중');}select.onchange=draw;document.querySelector('#qa-reset').onclick=draw;draw();</script></html>
