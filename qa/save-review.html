<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선택 저장 검수</title><body style="background:#123c31;color:#fff4d3;font:20px sans-serif;padding:24px"><h1>선택 저장 검수</h1><p>검수 이름의 기기 기록만 사용합니다.</p><button id="start">가을 선택 화면 열기</button><h2>저장된 진행</h2><pre id="saved"></pre><a href="/">게임으로 돌아가기</a><script>
const name='선택저장검수',key='eco-village-local-v2-'+encodeURIComponent(name);
document.querySelector('#saved').textContent=localStorage.getItem(key)||'기록 없음';
document.querySelector('#start').onclick=()=>{
 if(location.hostname!=='127.0.0.1'||location.port!=='8778')return;
 const state={schema:2,album:{},last:null,updatedAt:Date.now(),game:{stage:2,choices:['cut','hide',null,null],phase:'task',player:[62,67]}};
 localStorage.setItem('eco-village-local-name',name);localStorage.setItem(key,JSON.stringify(state));location.href='/';
};
</script></body></html>
