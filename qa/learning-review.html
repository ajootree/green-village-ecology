<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>엔딩 학습 검수</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/eco-ui.css"><link rel="stylesheet" href="/learning.css"><link rel="stylesheet" href="/interaction-flow.css"><link rel="stylesheet" href="/tablet-polish.css"><body><div style="padding:25px"><h1>엔딩 뒤 학습 수첩 검수</h1><select id="ending" aria-label="검수할 엔딩"><option value="cut,hide,spray,burn">모든 피해 E09</option><option value="garden,treat,care,reuse">서식지 피해 E07</option><option value="corridor,treat,care,reuse">모든 분야 관리 E01</option><option value="corridor,treat,spray,reuse">시설 관리 + 농약 E06</option></select><button id="report">학습 수첩 열기</button><button id="effort">실천 활동 열기</button></div><script type="module">import {resolveEnding} from '/model.mjs';import {openLearning} from '/learning-ui.mjs';const open=mode=>{const choices=document.querySelector('#ending').value.split(',');openLearning({record:{id:resolveEnding(choices),choices,repair:false},storageKey:'eco-learning-review',mode});};document.querySelector('#report').onclick=()=>open('report');document.querySelector('#effort').onclick=()=>open('effort');</script></body></html>
