<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>터치와 엔딩 흐름 검수</title><body style="font:18px sans-serif;background:#123c31;color:#eef2d4;padding:25px"><h1>터치와 엔딩 흐름 검수</h1><p>이 브라우저의 검수용 이름으로 모험을 준비합니다. 공개판에는 포함하지 않습니다.</p><form id="seed"><label>장면 <select id="scene"><option value="ending">첫 배드엔딩 직전 회의</option><option value="spring-result">봄 작업 뒤 전체 지도</option><option value="fall">가을 피해 조사</option><option value="winter">겨울 컵 받기</option></select></label><button>검수 모험 열기</button></form><script>
document.querySelector('#seed').onsubmit=e=>{e.preventDefault();const scenes={ending:{stage:4,phase:'final',choices:['cut','hide','spray','burn']},'spring-result':{stage:0,phase:'result',choices:['corridor',null,null,null]},fall:{stage:2,phase:'task',choices:['corridor','treat',null,null]},winter:{stage:3,phase:'task',choices:['corridor','treat','care',null]}};const name=localStorage.getItem('eco-village-local-name')||'',key=name?'eco-village-local-v2-'+encodeURIComponent(name):'eco-village-guest-v2';localStorage.setItem(key,JSON.stringify({schema:2,album:{},last:null,game:{...scenes[document.querySelector('#scene').value],player:[62,67]},updatedAt:Date.now()}));location.href='/';};
</script></body></html>
