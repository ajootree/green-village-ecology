<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>태블릿 흐름 검수</title><body style="font:20px sans-serif;background:#123b2d;color:#f5efd7;padding:24px"><h1>별도 시험 기록</h1><p>검수 전용 주소에서만 사용합니다.</p><form id="seed"><select id="scene" aria-label="시험 장면"><option value="spring">봄 이동</option><option value="ending">어두운 엔딩</option><option value="album">엔딩 10개 모은 앨범</option></select><button>시험 기록 열기</button></form><script type="module">
import {endings} from '/model.mjs';
const cases={E01:['corridor','treat','care','reuse'],E02:['detour','treat','care','reuse'],E03:['detour','treat','wait','reuse'],E04:['detour','treat','care','once'],E05:['detour','clean','care','reuse'],E06:['detour','treat','care','burn'],E07:['garden','treat','care','reuse'],E08:['cut','treat','care','reuse'],E09:['cut','hide','spray','burn'],E10:['cut','hide','spray','burn']};
document.querySelector('#seed').onsubmit=e=>{e.preventDefault();if(location.port!=='8778')return;const mode=document.querySelector('#scene').value,name='테스트친구',album={};if(mode==='album')for(const end of endings)album[end.id]={choices:cases[end.id],repair:end.id==='E10',at:Date.now()};localStorage.setItem('eco-village-local-name',name);localStorage.setItem('eco-village-local-v2-'+encodeURIComponent(name),JSON.stringify({schema:2,album,last:null,game:{stage:mode==='spring'?0:4,choices:mode==='spring'?[null,null,null,null]:cases.E09,phase:mode==='spring'?'explore':'final',player:[62,67]},updatedAt:Date.now()}));location.href='/';};
</script></body></html>
