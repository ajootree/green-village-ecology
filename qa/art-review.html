<!doctype html><html lang="ko"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/world.css"><title>초록마을 그림 검수</title><style>body{background:#263d35}#controls{display:flex;gap:8px;align-items:center;padding:9px;background:#1d322d;color:#f4e4b2;height:50px}select{padding:5px;min-width:100px;color:#f4e4b2;background:#375740;border:1px solid #9a9c70}#scene{height:calc(100dvh - 50px);display:grid;place-items:center;container-type:size}#scene .world-plane{border-radius:0}.caption{position:absolute;bottom:6px;right:8px;color:#fff1bb;background:#263d35d9;padding:5px 10px;font-size:11px}</style><nav id="controls"><span>그림 검수</span><span id="choices"></span><select id="chapter" aria-label="보기"><option value="">전체 지도</option><option value="0">숲</option><option value="1">하천</option><option value="2">농장</option><option value="3">축제</option><option value="source">하천 원본</option><option value="forest-source">숲 원본</option><option value="farm-source">농장 원본</option><option value="festival-source">축제 원본</option></select><label><input id="ending" type="checkbox" checked>엔딩</label></nav><main id="scene"></main><script type="module">import{seasons}from'/model.mjs';import{worldSVG}from'/world.mjs';const selects=seasons.map((s,i)=>{let el=document.createElement('select');el.ariaLabel=s.name+' 선택';el.innerHTML='<option value="">선택 전</option>'+s.choices.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');el.value=['cut','treat','care','reuse'][i];document.querySelector('#choices').append(el);el.onchange=draw;return el});function draw(){let choices=selects.map(e=>e.value||null),value=document.querySelector('#chapter').value;if(value.endsWith('source')){let [x,y,w,h]=({source:[660,200,420,400],'forest-source':[75,55,680,540],'farm-source':[880,100,670,390],'festival-source':[1080,390,520,420]})[value];document.querySelector('#scene').innerHTML=`<svg id=source-crop width=${w} height=${h} viewBox="${x} ${y} ${w} ${h}"><image href="/assets/village.webp" width=1600 height=900 /></svg>`;return;}document.querySelector('#scene').innerHTML=`<div class="world-plane">${worldSVG({choices,chapter:value===''?null:Number(value),stage:3,ending:document.querySelector('#ending').checked})}<div class="caption">${choices.join(' · ')}</div></div>`;}document.querySelector('#chapter').onchange=draw;document.querySelector('#ending').onchange=draw;draw();</script></html>
