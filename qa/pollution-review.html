<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오염 이야기 검수</title><body style="font:18px sans-serif;background:#123c31;color:#eef2d4;padding:25px"><h1>공기·물·흙 이야기 검수</h1><p>로컬 검수용 모험입니다. 실제 학교 계정을 쓰지 않습니다.</p><form id="seed"><label>검수 장면 <select id="scene"><option value="summer">하천 이야기와 선택 전</option><option value="farm">농장 이야기와 미션</option><option value="farm-result">농약 사용 뒤 농장</option><option value="winter">축제 이야기와 미션</option><option value="burn-result">태우기 뒤 축제장</option></select></label><button>장면 열기</button></form><script>document.querySelector('#seed').onsubmit=e=>{e.preventDefault();const scenes={summer:{stage:1,choices:['corridor',null,null,null],phase:'task'},farm:{stage:2,choices:['corridor','treat',null,null],phase:'task'},'farm-result':{stage:2,choices:['corridor','treat','spray',null],phase:'result'},winter:{stage:3,choices:['corridor','treat','spray',null],phase:'task'},'burn-result':{stage:3,choices:['corridor','treat','spray','burn'],phase:'result'}};localStorage.setItem('eco-village-guest-v2',JSON.stringify({schema:2,album:{},last:null,game:{...scenes[document.querySelector('#scene').value],player:[62,67]},updatedAt:Date.now()}));location.href='/';};</script></body></html>
